version: 2

models:
  - name: car_state_anomaly_detection
    config:
      contract:
        enforced: true
    columns:
      - name: car_number
        data_type: INT
      - name: lap
        data_type: INT
      - name: tire_temp_fl_c
        data_type: DOUBLE
      - name: tire_temp_fr_c
        data_type: DOUBLE
      - name: tire_temp_rl_c
        data_type: DOUBLE
      - name: tire_temp_rr_c
        data_type: DOUBLE
      - name: tire_pressure_fl_psi
        data_type: DOUBLE
      - name: tire_pressure_fr_psi
        data_type: DOUBLE
      - name: tire_pressure_rl_psi
        data_type: DOUBLE
      - name: tire_pressure_rr_psi
        data_type: DOUBLE
      - name: engine_temp_c
        data_type: DOUBLE
      - name: brake_temp_fl_c
        data_type: DOUBLE
      - name: brake_temp_fr_c
        data_type: DOUBLE
      - name: battery_charge_pct
        data_type: DOUBLE
      - name: fuel_remaining_kg
        data_type: DOUBLE
      - name: anomaly_tire_temp_fl
        data_type: BOOLEAN
      - name: position
        data_type: INT
        quote: true
      - name: gap_to_ahead_sec
        data_type: DOUBLE
      - name: gap_to_leader_sec
        data_type: DOUBLE
      - name: pit_stops
        data_type: INT
      - name: tire_compound
        data_type: VARCHAR(2147483647)
      - name: tire_age_laps
        data_type: INT

  - name: deploy_agent
    config:
      contract:
        enforced: true
    columns:
      - name: car_number
        data_type: INT
      - name: lap
        data_type: INT
      - name: position
        data_type: INT
        quote: true
      - name: tire_compound_current
        data_type: VARCHAR(2147483647)
      - name: tire_age_laps
        data_type: INT
      - name: anomaly_tire_temp_fl
        data_type: BOOLEAN
      - name: suggestion
        data_type: VARCHAR(2147483647)
      - name: condition_summary
        data_type: VARCHAR(2147483647)
      - name: race_context
        data_type: VARCHAR(2147483647)
      - name: recommended_tire_compound
        data_type: VARCHAR(2147483647)
      - name: recommended_stint_laps
        data_type: INT
      - name: recommended_reason
        data_type: VARCHAR(2147483647)
      - name: reasoning
        data_type: VARCHAR(2147483647)
      - name: raw_response
        data_type: VARCHAR(2147483647)
