[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "demo-confluent-intelligence-f1"
version = "0.1.0"
description = "F1 Pit Wall AI Demo — Real-time pit strategy with Flink Streaming Agents on Confluent Cloud"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10,<3.14"

dependencies = [
    "python-dotenv>=1.0.0,<2.0",
    "rich>=13.0.0",
    "boto3>=1.26.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    # f1-pitwall live dashboard (consumes the attendee's own Kafka topics)
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "confluent-kafka[avro]>=2.4.0",  # >=2.4 for AdminClient.delete_records (uv run reset)
    "fastavro>=1.9.0",
    "httpx>=0.27.0",  # required by confluent-kafka's Schema Registry client
    # f1-social-feed-rtce: MCP client to the Real-Time Context Engine.
    # Capped below 2.0 deliberately. `scripts/social_feed_rtce/rtce_client.py` is
    # written against the 1.x streamable-HTTP API: `streamablehttp_client(url,
    # headers=...)` yielding a 3-tuple. mcp 2.0 renamed it to
    # `streamable_http_client` AND dropped `headers=` in favour of passing a
    # pre-built `http_client`, so an uncapped `>=1.8.0` resolved to 2.x and broke
    # the import outright — `uv run f1-social-feed-rtce` could not start. Lifting
    # this cap means migrating that client (RTCE's Basic auth has to move into a
    # custom httpx client) and re-verifying against a live RTCE endpoint.
    "mcp>=1.8.0,<2.0",
]

[project.scripts]
deploy = "deploy:main"
destroy = "scripts.common.destroy:main"
api-keys = "scripts.common.api_keys:main"
reset = "scripts.reset:main"
race = "scripts.race_control:main"
setup-mcp = "scripts.setup_mcp:main"
workshop = "scripts.workshop.cli:main"
create-workshop = "scripts.workshop.create:main"
teardown-workshop = "scripts.workshop.teardown:main"
selfservice = "scripts.selfservice.cli:main"
f1-race = "scripts.selfservice.race:main"
f1-reset = "scripts.participant.reset:main"
f1-rtce = "scripts.participant.rtce:main"
f1-sql = "scripts.workshop.sql_shell:main"
f1-onboard = "scripts.workshop.onboard:main"
f1-pitwall = "scripts.pitwall.app:main"
f1-social-feed = "scripts.social_feed.app:main"
f1-social-feed-rtce = "scripts.social_feed_rtce.app:main"

[project.urls]
Repository = "https://github.com/confluentinc/demo-confluent-intelligence-f1"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.hatch.build.targets.sdist]
include = [
    "scripts/",
    "deploy.py",
    "README.md",
    "LICENSE",
]
exclude = [
    "/.git",
    "/terraform",
    "/datagen",
    "/data",
    "*.pyc",
    "__pycache__",
]

[dependency-groups]
dev = [
    "ruff>=0.15.11",
    "pytest>=8.0.0",
]

# One command covers the whole suite: `uv run pytest`. The runtime extras
# datagen/tests/ needs (confluent-kafka[avro], fastavro, httpx) are already
# project dependencies above, so they need no `--with` flags here.
[tool.pytest.ini_options]
testpaths = ["tests", "datagen/tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports, undefined names)
    "I",    # isort (import order)
    "B",    # flake8-bugbear (likely bugs and design issues)
    "UP",   # pyupgrade (modernize Python syntax)
    "RUF",  # Ruff-specific rules
]
ignore = [
    "B008",  # do not perform function calls in default arguments
]

[tool.ruff.lint.per-file-ignores]
"datagen/drivers.py" = ["E501"]  # data rows are intentionally wide

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
